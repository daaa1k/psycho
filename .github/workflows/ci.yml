# PSYCHO CI: format, build, and tests on macOS, Linux, and Windows.
#
# Windows: GPUI (Zed) does not currently ship a supported Windows backend for this
# pinned revision, and the `psycho` binary requires the `gui` feature. The Windows
# job therefore validates the core library (default features) only — fmt, `cargo build`,
# and `cargo test` without `gui`. macOS and Ubuntu run the full `--features gui` suite.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui:
    name: gui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            libasound2-dev \
            libfontconfig1-dev \
            libssl-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            pkg-config
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo build
        run: cargo build --locked --features gui
      - name: cargo test
        run: cargo test --locked --features gui

  windows-core:
    name: core (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo fmt
        run: cargo fmt --check
      # No `gui`: GPUI platform support for Windows is not exercised in this repo yet.
      - name: cargo build
        run: cargo build --locked
      - name: cargo test
        run: cargo test --locked
