<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSYCHO キャンバス操作プロトタイプ</title>
<style>
*{box-sizing:border-box}body{margin:24px;background:#f4f5f8;color:#243047;font:15px/1.6 system-ui}h1{font-size:24px;margin:0}p{margin:8px 0}button,select,input,textarea{font:inherit;padding:6px 10px;border:1px solid #bbc3d0;border-radius:5px;background:white;color:inherit}button{cursor:pointer}button:hover{background:#edf1ff}button:disabled{opacity:.4;cursor:default}button.active{background:#3658b8;color:white}header,#state,#guide{margin-bottom:16px}#state{padding:12px;background:#e7edff;border-radius:8px}main{display:grid;grid-template-columns:160px minmax(440px,1fr) 260px;gap:16px}aside,article,#guide{background:white;padding:16px;border-radius:8px}aside button{display:block;width:100%;margin-bottom:8px}.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.element{padding:10px;border:2px solid transparent;position:relative;white-space:pre-wrap;overflow-wrap:anywhere}.element.selected{border-color:#3658b8;background:#f4f6ff}.kind{font-size:11px;color:#67738a;display:block}.columns{display:flex;gap:0}.column{min-width:0;flex:1;border:1px dashed #c2cbdc;padding:4px}.divider{width:12px;cursor:col-resize;background:#e7edff;touch-action:none}.slot{height:12px;border-radius:3px}.slot.over{background:#3658b8}.empty{padding:12px;color:#778198;font-size:12px}textarea{width:100%;min-height:100px}input,select{max-width:100%}label{display:block;margin:12px 0}pre{margin:0;white-space:pre-wrap}h2{font-size:24px;margin:0}.mock-image{background:#e7edff;padding:24px;text-align:center}#guide button{margin:4px}#outline{font-size:12px;white-space:pre-wrap}small{color:#63708a} @media(max-width:950px){main{grid-template-columns:1fr}aside button{display:inline-block;width:auto}}
</style>
<header><h1>キャンバスで編集できる範囲</h1><p>使い捨ての操作プロトタイプ。選択と文字編集、列の内外への移動、属性編集の分担を試します。変更はメモリ内だけに保持します。</p><small>仮定：単一選択／追加は指定先の末尾／文字編集はフォーカスを外すか Escape で確定／削除確認なし（2 列は中身も削除）。画像は参照先の文字列のみ、コードの構文ハイライト・KDL 読み書き・Undo は未実装です。</small></header>
<section id="state" aria-live="polite"></section>
<section id="guide"><b>操作例</b><div id="tabs"></div><p id="description"></p><div id="steps"></div></section>
<main><aside><b>スライド</b><div id="slides"></div><button onclick="send({type:'slideAdd'})">白紙を追加</button><button onclick="send({type:'slideDelete'})">スライド削除</button><button onclick="send({type:'slideMove',delta:-1})">前へ移動</button><button onclick="send({type:'slideMove',delta:1})">後へ移動</button></aside>
<article><div class="toolbar"><select id="addType"><option value="heading">見出し</option><option value="text">本文</option><option value="bullets">箇条書き</option><option value="code">コード</option><option value="image">画像</option><option value="columns">2 列</option></select><select id="addParent"></select><button onclick="send({type:'add',kind:document.querySelector('#addType').value,parent:document.querySelector('#addParent').value})">追加</button><button onclick="send({type:'delete'})">選択要素を削除</button></div><small>クリックで選択、ダブルクリックで文字編集。要素をドラッグし、青い挿入位置にドロップ。2 列は「2 列」ラベルをドラッグ。</small><div id="canvas"></div></article>
<aside><b>インスペクター</b><div id="inspector"></div><hr><b>現在の構造</b><div id="outline"></div><button onclick="reset()">初期状態に戻す</button></aside></main>
<script>
// 操作の意味は DOM から独立させる。
const initial=()=>({slides:[{id:'s1',elements:[{id:'h',kind:'heading',text:'変更点'},{id:'cols',kind:'columns',width:60,left:[{id:'b',kind:'bullets',items:['計測する','依存関係を見直す','増分ビルドを効かせる']}],right:[{id:'c',kind:'code',text:'fn main() {\n    println!("measure first");\n}',language:'rust'}]}]},{id:'s2',elements:[{id:'h2',kind:'heading',text:'結果'},{id:'im',kind:'image',path:'assets/build-times.png',text:'同じマシンで 3 回計測した中央値'}]}],slide:'s1',selected:null,editing:false,next:10,message:'初期状態'});
const kinds={heading:'見出し',text:'本文',bullets:'箇条書き',code:'コード',image:'画像と説明',columns:'2 列'};
function groups(s){const slide=s.slides.find(x=>x.id===s.slide);if(!slide)return [];return [{id:'root',label:'スライド直下',list:slide.elements},...slide.elements.filter(x=>x.kind==='columns').flatMap(x=>[{id:x.id+':left',label:'左列 ('+x.id+')',list:x.left},{id:x.id+':right',label:'右列 ('+x.id+')',list:x.right}])];}
function locate(s,id){for(const g of groups(s)){const index=g.list.findIndex(x=>x.id===id);if(index>=0)return {...g,index,element:g.list[index]};}return null;}
function reduce(state,a){const s=structuredClone(state);let found=locate(s,s.selected),e=found?.element;s.message='';
 switch(a.type){
 case 'select':s.selected=a.id;s.editing=false;s.message='要素を選択';break;
 case 'edit':if(e&&e.kind!=='columns'){s.editing=true;s.message='文字編集中：Delete は文字を削除';}break;
 case 'finish':s.editing=false;s.message='文字編集を確定';break;
 case 'text':if(e){if(e.kind==='bullets')e.items=a.value.split('\n');else e.text=a.value;s.message='文字を変更';}break;
 case 'attr':if(e){if(a.key==='width')e.width=Math.min(99,Math.max(1,Math.round(Number(a.value)||50)));else if(a.key==='path'){if(!a.value.trim()){s.message='画像参照先は空にできません';break;}e.path=a.value;}else e.language=a.value;s.message='属性を変更';}break;
 case 'delete':if(s.editing){s.message='文字編集中は要素削除を行いません';break;}if(found){found.list.splice(found.index,1);s.selected=null;s.message='要素を削除（2 列の削除は内部の要素も対象）';}break;
 case 'move':{const from=locate(s,a.id),to=groups(s).find(x=>x.id===a.parent);if(!from||!to)break;if(from.element.kind==='columns'&&a.parent!=='root'){s.message='移動できません：2 列を列の中には置けません';break;}let index=a.index;if(from.list===to.list&&from.index<index)index--;from.list.splice(from.index,1);to.list.splice(index,0,from.element);s.selected=a.id;s.editing=false;s.message='要素を '+to.label+' に移動';break;}
 case 'add':{const to=groups(s).find(x=>x.id===a.parent);if(!to)break;if(a.kind==='columns'&&a.parent!=='root'){s.message='追加できません：2 列の入れ子は範囲外です';break;}const n={id:'e'+s.next++,kind:a.kind,text:a.kind==='heading'?'新しい見出し':''};if(a.kind==='columns')Object.assign(n,{width:50,left:[],right:[]});if(a.kind==='bullets')n.items=[''];if(a.kind==='image')Object.assign(n,{path:'assets/example.png',text:''});if(a.kind==='code')n.language='';to.list.push(n);s.selected=n.id;s.editing=false;s.message='末尾に '+kinds[n.kind]+' を追加';break;}
 case 'item':if(e?.kind==='bullets'){if(a.op==='add')e.items.push('新しい項目');if(a.op==='delete')e.items.splice(a.index,1);if(a.op==='up'&&a.index>0)[e.items[a.index-1],e.items[a.index]]=[e.items[a.index],e.items[a.index-1]];s.message='箇条書き項目を変更';}break;
 case 'slide':s.slide=a.id;s.selected=null;s.editing=false;break;
 case 'slideAdd':{const slide={id:'s'+s.next++,elements:[]};s.slides.push(slide);s.slide=slide.id;s.selected=null;s.editing=false;s.message='白紙スライドを追加';break;}
 case 'slideDelete':{const i=s.slides.findIndex(x=>x.id===s.slide);if(i>=0)s.slides.splice(i,1);s.slide=s.slides[Math.min(i,s.slides.length-1)]?.id;s.selected=null;s.editing=false;s.message='スライドを削除';break;}
 case 'slideMove':{const i=s.slides.findIndex(x=>x.id===s.slide),j=i+a.delta;if(i>=0&&j>=0&&j<s.slides.length)[s.slides[i],s.slides[j]]=[s.slides[j],s.slides[i]];break;}
 }return s;}
</script>
<script>
let state=initial(),dragged=null,scenario=0,step=0;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const scenarios=[{name:'選択と文字編集',description:'コードを選び、文字編集中の要素削除が防がれることを確認します。',steps:[['コードを選択',{type:'select',id:'c'}],['文字編集を開始',{type:'edit'}],['要素削除を試す',{type:'delete'}],['文字編集を確定',{type:'finish'}],['要素を削除',{type:'delete'}]]},{name:'列の内外へ移動',description:'箇条書きを右列、次にスライド直下へ移します。2 列を列の中へ移す操作は拒否します。',steps:[['箇条書きを右列へ',{type:'move',id:'b',parent:'cols:right',index:1}],['箇条書きを列の外へ',{type:'move',id:'b',parent:'root',index:2}],['2 列を左列内へ移動してみる',{type:'move',id:'cols',parent:'cols:left',index:0}]]},{name:'白紙から追加',description:'白紙に 2 列を作り、左列に本文を追加します。',steps:[['白紙スライドを追加',{type:'slideAdd'}],['2 列を追加',{type:'add',kind:'columns',parent:'root'}],['左列に本文を追加',{type:'add',kind:'text',parent:'e11:left'}]]}];
function send(a){state=reduce(state,a);render();}
function reset(){state=initial();step=0;render();renderGuide();}
function renderGuide(){$('#tabs').innerHTML=scenarios.map((s,i)=>`<button class="${i===scenario?'active':''}" onclick="scenario=${i};reset()">${s.name}</button>`).join('');$('#description').textContent=scenarios[scenario].description;$('#steps').innerHTML=scenarios[scenario].steps.map(([label],i)=>`<button ${i!==step?'disabled':''} onclick="runStep()">${i+1}. ${label}</button>`).join('');}
function runStep(){send(scenarios[scenario].steps[step][1]);step++;renderGuide();}
function slot(parent,index){const d=document.createElement('div');d.className='slot';d.ondragover=ev=>{ev.preventDefault();ev.stopPropagation();d.classList.add('over');};d.ondragleave=()=>d.classList.remove('over');d.ondrop=ev=>{ev.preventDefault();ev.stopPropagation();send({type:'move',id:dragged,parent,index});};return d;}
function drawGroup(parent,list,target){target.append(slot(parent,0));list.forEach((e,i)=>{target.append(drawElement(e));target.append(slot(parent,i+1));});if(!list.length){const hint=document.createElement('div');hint.className='empty';hint.textContent='空です。上の隙間にドロップするか、追加先にこの場所を選びます。';target.append(hint);}}
function drawElement(e){const box=document.createElement('div');box.className='element'+(state.selected===e.id?' selected':'');box.draggable=!state.editing;box.ondragstart=ev=>{ev.stopPropagation();dragged=e.id;ev.dataTransfer.setData('text/plain',e.id);};box.onclick=ev=>{ev.stopPropagation();if(state.selected!==e.id){state=reduce(state,{type:'select',id:e.id});renderState();document.querySelectorAll('.element.selected').forEach(n=>n.classList.remove('selected'));box.classList.add('selected');renderInspector();}};box.ondblclick=ev=>{ev.stopPropagation();state=reduce(state,{type:'select',id:e.id});send({type:'edit'});};const label=document.createElement('span');label.className='kind';label.textContent=kinds[e.kind];box.append(label);
 if(e.kind==='columns'){const row=document.createElement('div');row.className='columns';const left=document.createElement('div'),right=document.createElement('div'),divider=document.createElement('div');left.className=right.className='column';left.style.flexBasis=e.width+'%';right.style.flexBasis=(100-e.width)+'%';divider.className='divider';divider.title='ドラッグして列幅調整';divider.onpointerdown=ev=>{ev.preventDefault();ev.stopPropagation();const rect=row.getBoundingClientRect();state=reduce(state,{type:'select',id:e.id});const move=ev=>send({type:'attr',key:'width',value:100*(ev.clientX-rect.left)/rect.width});const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);};drawGroup(e.id+':left',e.left,left);drawGroup(e.id+':right',e.right,right);row.append(left,divider,right);box.append(row);return box;}
 if(state.selected===e.id&&state.editing){const input=document.createElement('textarea');input.value=e.kind==='bullets'?e.items.join('\n'):e.text;input.setAttribute('aria-label',kinds[e.kind]+'を編集');input.onclick=input.ondblclick=ev=>ev.stopPropagation();input.oninput=()=>{state=reduce(state,{type:'text',value:input.value});renderState();};input.onblur=()=>{state=reduce(state,{type:'finish'});setTimeout(render,0);};input.onkeydown=ev=>{if(ev.key==='Escape'){ev.stopPropagation();input.blur();}};box.append(input);setTimeout(()=>input.focus(),0);return box;}
 const content=document.createElement('div');if(e.kind==='heading')content.innerHTML='<h2>'+esc(e.text||'（空の見出し）')+'</h2>';else if(e.kind==='bullets')content.innerHTML='<ul>'+e.items.map(t=>'<li>'+esc(t||'（空の項目）')+'</li>').join('')+'</ul>';else if(e.kind==='code')content.innerHTML='<pre>'+esc(e.text||'（空のコード）')+'</pre>';else if(e.kind==='image')content.innerHTML='<div class="mock-image">画像参照<br>'+esc(e.path)+'</div><small>'+esc(e.text||'（画像説明なし）')+'</small>';else content.textContent=e.text||'（空の本文）';box.append(content);return box;}
function renderState(){const f=locate(state,state.selected);$('#state').textContent=`${state.slides.length} 枚 ／ ${f?kinds[f.element.kind]+'を選択（'+f.label+'）':'選択なし'} ／ ${state.editing?'文字編集中':'要素操作'} — ${state.message}`;$('#outline').textContent=groups(state).map(g=>g.label+'\n'+g.list.map(e=>'  '+kinds[e.kind]+': '+(e.kind==='columns'?e.width+' : '+(100-e.width):e.kind==='bullets'?e.items.join(' / '):e.kind==='image'?e.path+' '+e.text:e.text)).join('\n')).join('\n');}
function render(){renderState();$('#slides').innerHTML=state.slides.map((s,i)=>`<button class="${s.id===state.slide?'active':''}" onclick="send({type:'slide',id:'${s.id}'})">${i+1}. ${esc(s.elements.find(e=>e.kind==='heading')?.text||'白紙')}</button>`).join('');const previous=$('#addParent').value;$('#addParent').innerHTML=groups(state).map(g=>`<option value="${g.id}">${g.label}</option>`).join('');if(groups(state).some(g=>g.id===previous))$('#addParent').value=previous;$('#canvas').replaceChildren();const root=groups(state)[0];if(root)drawGroup('root',root.list,$('#canvas'));renderInspector();}
function renderInspector(){const e=locate(state,state.selected)?.element;$('#inspector').innerHTML=e?`<p>${kinds[e.kind]}</p>`:'要素を選択してください。';if(!e)return;
 const field=(label,key,value,type='text')=>{const l=document.createElement('label');l.textContent=label;const input=document.createElement('input');input.type=type;input.value=value??'';if(type==='number'){input.min=1;input.max=99;}input.onchange=()=>send({type:'attr',key,value:input.value});l.append(input);$('#inspector').append(l);};
 if(e.kind==='image')field('画像参照先（相対パス）','path',e.path);if(e.kind==='code')field('コード言語（空欄で指定なし）','language',e.language);if(e.kind==='columns')field('左列の幅 %（右列は残り）','width',e.width,'number');
 if(e.kind==='bullets'){$('#inspector').insertAdjacentHTML('beforeend',e.items.map((t,i)=>`<p>${i+1}. ${esc(t)} <button onclick="send({type:'item',op:'up',index:${i}})">↑</button><button onclick="send({type:'item',op:'delete',index:${i}})">削除</button></p>`).join('')+'<button onclick="send({type:\'item\',op:\'add\'})">項目追加</button>');}
}
document.addEventListener('keydown',ev=>{if(['INPUT','TEXTAREA','SELECT'].includes(ev.target.tagName)||ev.isComposing)return;if(ev.key==='Delete'||ev.key==='Backspace'){ev.preventDefault();send({type:'delete'});}if(ev.key==='Escape')send({type:'select',id:null});});render();renderGuide();
</script></html>
